name: uptime

# An outside check of Приборка: every 5 minutes from GitHub, not from the server it watches.
# Down = /health does not answer "status":"ok" for about 2.5 minutes (5 tries), so a deploy's
# restart is not an outage. An outage opens one issue labelled `outage` (GitHub notifies the
# assignee) and, when the TG_BOT_TOKEN and TG_CHAT_IDS secrets are set, a Telegram message;
# recovery closes the issue and says so once.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      URL: https://priborka-test.noeticecho.space/health
    steps:
      - name: Probe /health
        id: p
        run: |
          set +e
          ok=0; body=""
          for i in 1 2 3 4 5; do
            body=$(curl -sS -m 20 "$URL" 2>&1)
            if echo "$body" | jq -e '.status == "ok"' >/dev/null 2>&1; then ok=1; break; fi
            [ "$i" -lt 5 ] && sleep 30
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          { echo "body<<EOB"; echo "$body" | head -c 400; echo; echo "EOB"; } >> "$GITHUB_OUTPUT"
      - name: Open or close the outage issue
        env:
          GH_TOKEN: ${{ github.token }}
          OK: ${{ steps.p.outputs.ok }}
          BODY: ${{ steps.p.outputs.body }}
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHATS: ${{ secrets.TG_CHAT_IDS }}
        run: |
          notify() {
            [ -n "$TG_TOKEN" ] || return 0
            for c in ${TG_CHATS//,/ }; do
              curl -sS -m 15 -o /dev/null "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=$c" --data-urlencode "text=$1" || true
            done
          }
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --label outage --state open --json number --jq '.[0].number // empty')
          now=$(TZ=Europe/Moscow date '+%d.%m %H:%M МСК')
          if [ "$OK" = "1" ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" -R "$GITHUB_REPOSITORY" -c "Снова отвечает с $now."
              notify "✅ Приборка снова отвечает ($now)."
            fi
          elif [ -z "$open" ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --label outage --assignee sudo-make-god \
              --title "Приборка не отвечает ($now)" \
              --body "$(printf '%s не отвечает «status: ok» около 2,5 минуты (5 попыток).\n\nПоследний ответ:\n```\n%s\n```\n\nЧто делать: docs/ops.md в NoeticTask, раздел о /health.' "$URL" "$BODY")"
            notify "🔴 Приборка не отвечает ($now). $URL"
          fi
