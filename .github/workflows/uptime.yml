name: uptime

# An outside check of Приборка every 5 minutes, from GitHub rather than from the server it watches.
# GitHub's scheduler never fired this workflow (11–12.11: only manual runs), so a run does not rely
# on it: it checks every 5 minutes for about 5 h 40 min and then starts its own successor with
# workflow_dispatch (the one event GITHUB_TOKEN may start). The schedule stays as a restarter in
# case the chain ever breaks. Down = no "status":"ok" for ~2.5 min; scripts/probe.sh opens one
# `outage` issue (GitHub notifies the assignee) and, with TG_BOT_TOKEN and TG_CHAT_IDS set, a
# Telegram message; recovery closes it.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      URL: https://priborka-test.noeticecho.space/health
      GH_TOKEN: ${{ github.token }}
      TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHATS: ${{ secrets.TG_CHAT_IDS }}
    steps:
      - uses: actions/checkout@v4
      - name: Check every 5 minutes for ~5 h 40 min
        run: |
          end=$(( $(date +%s) + 340*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            started=$(date +%s)
            ./scripts/probe.sh || true
            left=$(( 300 - ($(date +%s) - started) ))
            [ "$left" -gt 0 ] && sleep "$left"
          done
      - name: Start the next run
        if: always()
        run: gh workflow run uptime.yml -R "$GITHUB_REPOSITORY" --ref main
